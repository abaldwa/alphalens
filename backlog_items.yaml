    notes: "Architectural mismatch; requires regime gate implementation"

  B-019:
    title: "R10 sector momentum uses individual stock ranking (wrong methodology)"
    description: |
      R10 (Moskowitz & Grinblatt 1999 sector-level momentum) is specified to rank sectors
      by their returns and select top sectors.

      Current implementation: Ranks INDIVIDUAL STOCKS by sector membership, not sector returns.
      This is NOT sector momentum; it's individual momentum with sector labels.

      Audit finding: Code mislabeled; does not implement published sector momentum.

      Fix: Implement true sector-level momentum:
           1. Calculate sector-level returns (aggregate sector OHLCV)
           2. Rank sectors by momentum (3/6/9/12 month lookbacks)
           3. Within top sectors, hold all stocks (or top N by liquidity)
           4. Portfolio is sector-concentrated, not stock-concentrated

      Impact: Completely changes portfolio construction and risk profile.

      Validation: Re-backtest R10 as true sector momentum; compare to published benchmarks
                  Expected Sharpe: 0.6-0.8 (lower than individual momentum due to concentration)

