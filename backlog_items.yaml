  B-020:
    title: "R11 ranking direction inverted + 70% threshold missing"
    description: |
      R11 (George & Hwang 2004 52-week-high momentum) has TWO CRITICAL BLOCKERS:

      1. **Ranking direction inverted** (CRITICAL)
         - Spec: Buy stocks with LOWER price-to-high ratio (closer to bottom = momentum signal)
         - Implementation: Selects HIGHEST scores (trend-following, not contrarian)
         - This is backwards; completely inverts strategy intent

      2. **70% threshold logic missing** (CRITICAL)
         - Spec requires (George & Hwang 2004, p. 2155): Buy when price < 70% of 52-week high
         - Implementation: No threshold; just ranks all stocks
         - Missing the critical filtering step

      Fix: (A) Invert ranking direction (select LOW price-to-high, not HIGH)
           (B) Implement 70% threshold logic
           (C) Verify holding period and rebalance frequency match spec

      Validation: Re-backtest R11 with fixes; should show contrarian behavior
                  Expected Sharpe: 0.6-0.8 (contrarian, not trend-following)

    criticality: "BLOCKER"
    found_by: "momentum-strategy-audit (R11 audit)"
    found_in: "R-family audit batch 2026-08-25"
    depends_on: ["B-003"]
    owner: null
