    description: |
      R12 (Chui et al. 2023 / Nigam & Pandey 2023 Indian momentum) has multiple issues:

      1. **Overlapping portfolios missing** (inherited from B-001)
         - Same as R1-R3: missing K-portfolio structure, using 100% replacement

      2. **Skip-month not applied by default** (HIGH)
         - Implementation exists but not wired into R12 by default
         - Must be explicitly configured; most backtest runs miss skip-month benefit

      3. **ADTV filter may bypass liquidity safety** (MEDIUM)
         - Registry specifies: ADTV > ₹5-10Cr floor
         - Audit finding: Filter applies but can be disabled per-backtest
         - Risk: User may run R12 without ADTV floor, trading illiquid stocks

      Fix: (A) Apply B-001 fix (overlapping portfolios) when implemented
           (B) Wire skip-month by default for R12
           (C) Document ADTV floor as mandatory (no bypass option)

      Depends on: B-001 (overlapping portfolios), B-002 (skip-month default)

    criticality: "HIGH"
    found_by: "momentum-strategy-audit (R12 audit)"
    found_in: "R-family audit batch 2026-08-25"
    depends_on: ["B-001", "B-002"]
