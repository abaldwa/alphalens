      Jegadeesh & Titman (1993) use K overlapping sub-portfolios with 1/K monthly replacement.
      AlphaLens currently uses full portfolio replacement (100% turnover) each month.

      REVISED IMPACT (post-R1 audit 2026-08-25):
      - Transaction costs: ~0.05-0.10 Sharpe lower due to extra turnover (not 2-3x as initially thought)
      - Current measured Sharpe: 0.91 (mid-cap Phase 1), matches "with skip-month" range
      - Expected improvement with K=12 overlapping: +0.05-0.10 Sharpe
      - Operational impact: Acceptable simplification per CLAUDE.md philosophy ("no over-engineering")

      Status: Known intentional simplification; not a critical bug, but performance limitation.
      Recommendation: Document for users; implement in Phase 4+ if paper-trading Sharpe targets miss.

      Affects: R1 (core), R3, R4-R12 (all momentum variants)

      Fix: Refactor strategies/momentum_identity.py to implement K-portfolio overlapping structure (Phase 4+).
      Validation: Re-audit R1-R12 after fix; expect +0.05-0.10 Sharpe improvement.

    criticality: "HIGH"
    found_by: "momentum-strategy-audit (Phase 2 test)"
    found_in: "R1 audit (2026-08-25)"
    depends_on: ["B-003"]
    owner: null
    status: "open"
    affects_strategies: ["R1", "R3", "R4", "R5", "R6", "R7", "R8", "R9", "R10", "R11", "R12"]
    notes: "Intentional simplification, not blocker for paper trading. Revisit if live Sharpe underperforms by >0.05."

  B-003:
    title: "Fix momentum-strategy-audit false positive (R1 APPROVED despite BLOCKER issues)"
    description: |
      Phase 2 R1 audit returned APPROVED despite missing overlapping portfolios + skip-month.
      Root cause: Audit prompt lacked explicit specification checklist and forced deviation inventory.

      7 prevention mechanisms needed:
      1. Specification-as-code: formal J&T definition with 15+ checklist items
      2. Forced deviation inventory: enumerate ALL deviations (not just notable ones)
      3. Citation requirements: specific pages/equations from papers (not paraphrasing)
      4. Adversarial verification: "what if overlapping portfolios missing? Does cost match J&T?"
      5. Multi-pass review: reconsider verdict after adversarial checks
      6. Human expert gate: user spot-check 2-3 code sections before backtest
      7. False positive QA tests: test agent with deliberate J&T violations; verify returns BLOCKED

      Current prompt has none of these. Needs full rewrite with specification-as-code.

      Fix: Update momentum-strategy-audit prompt in docs/agents/strategy-audit-prompts.md
      - Add formal J&T specification with 15+ checklist items (overlapping portfolios, skip-month, etc.)
      - Force enumeration of ALL deviations (not just surprising ones)
      - Require citations for every claim
      - Add adversarial verification section
      - Change verdict logic: "APPROVED WITH CRITICAL NOTES" if BLOCKER/CRITICAL deviations found

      This fix BLOCKS B-001 re-audit until completed.

    criticality: "CRITICAL"
