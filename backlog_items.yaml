  B-001:
    title: "Implement overlapping portfolios in momentum strategies (R1-R12)"
    description: |
      Jegadeesh & Titman (1993) use K overlapping sub-portfolios with 1/K monthly replacement.
      AlphaLens currently uses full portfolio replacement (100% turnover) each month.

      REVISED IMPACT (post-R1 audit 2026-08-25):
      - Transaction costs: ~0.05-0.10 Sharpe lower due to extra turnover (not 2-3x as initially thought)
      - Current measured Sharpe: 0.91 (mid-cap Phase 1), matches "with skip-month" range
      - Expected improvement with K=12 overlapping: +0.05-0.10 Sharpe
      - Operational impact: Acceptable simplification per CLAUDE.md philosophy ("no over-engineering")

      Status: Known intentional simplification; not a critical bug, but performance limitation.
      Recommendation: Document for users; implement in Phase 4+ if paper-trading Sharpe targets miss.

      Affects: R1 (core), R3, R4-R12 (all momentum variants)

      Fix: Refactor strategies/momentum_identity.py to implement K-portfolio overlapping structure (Phase 4+).
      Validation: Re-audit R1-R12 after fix; expect +0.05-0.10 Sharpe improvement.

    criticality: "HIGH"
