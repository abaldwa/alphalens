  B-018:
    title: "R9 4-mode vol-scaling logic missing + regime gate not implemented"
    description: |
      R9 (Moreira & Muir 2017 4-mode vol-scaling momentum) has TWO CRITICAL DEVIATIONS:

      1. **4-mode discrete logic missing** (CRITICAL)
         - Spec requires: discrete exposure buckets (100%/75%/50%/25% based on vol quantiles)
         - Implementation uses: continuous scaling formulas (1/vol, 1/vol², target/vol)
         - Fundamental mismatch: different methodology entirely

      2. **Regime gate not implemented** (CRITICAL)
         - Spec requires: EMA-RSI dynamic mode selector to switch between 4 modes
         - Implementation: has no regime gate; 4 modes tested as 4 separate backtest runs
         - Impact: Can't deploy as single strategy; modes are post-hoc alternatives, not adaptive

      3. **Live-backtest parity impossible** (consequence)
         - Without regime gate, can't verify signal parity between live and backtest

      Fix: (A) Implement regime gate (EMA-RSI or similar state machine)
           (B) Implement discrete 4-mode bucketing logic
           (C) Integrate into single strategy with adaptive mode switching

      Validation: Backtest with regime gate; verify Sharpe improves vs. single-mode baseline

      Architecture change: R9 changes from "4 separate strategies" to "1 strategy with 4 modes"

    criticality: "BLOCKER"
