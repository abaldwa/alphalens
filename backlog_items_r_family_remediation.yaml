  - id: B-017
    title: "Add monthly (21d) rebalance variant for R12 signal-decay testing"
    area: "Backtest / R-Family"
    status: "⏳ pending"
    severity: "🟡 medium"
    blocked_on: "B-015 (need baseline to compare against)"
    depends_on: [B-015]
    time_estimate: "~2-3 hours"
    description: |
      **Critical design flaw found:** R12 is a 1-month (21-day) reversal signal held for 3 months
      (quarterly, 63-day rebalance). By design, the signal mean-reverts and re-reverses long before
      rebalance, leaving stale positions. This signal-cadence mismatch is unaddressed in code.

      **Action:**
      1. Create new queue variant: `r12_momentum_reversal_liquidity_monthly_rebalance.json`
      2. Same jobs as R12 standard queue but with `rebalance_cadence_days: 21` instead of `63`
      3. Run the monthly-rebalance variant (2 jobs, both reversal bands, same 2019-2025 window)
      4. Compare Sharpe/CAGR/DD: monthly (21d) vs quarterly (63d) rebalance
      5. Expected: monthly improves Sharpe (fresher signal), quarterly may show decay artifact

      **Success criteria:**
      - Monthly variant lands in `backtest_runs` table
      - Sharpe monthly > Sharpe quarterly (signal decay hypothesis confirmed)
      - If monthly reversal now matches 6mo momentum Sharpe (0.93+), signal-cadence mismatch was the culprit
      - If monthly still underperforms (Sharpe <0.85), the reversal edge is weak regardless of cadence

      **Gate:** If monthly improves to >0.85 Sharpe, proceed to B-018 with monthly cadence as the default. If <0.85, R12 is archived.

    notes: |
      - This is a REQUIRED test before any R12 deployment — cadence mismatch is a fundamental design error
      - Monthly 21d cadence aligns with the 21-day signal window (1 month) so reversal is fresh every rebalance
      - Quarterly 63d cadence was probably copy-pasted from R1/R3/R10 without thought to signal horizon

  - id: B-018
    title: "Add sub-period breakdown (2019-2022 vs 2023-2025) for reversal stability"
    area: "Backtest / R-Family"
    status: "⏳ pending"
    severity: "🟡 medium"
    blocked_on: "B-015 (need baseline to decompose)"
    depends_on: [B-015]
    time_estimate: "~2-3 hours"
    description: |
      **Reversal effects are regime-dependent** — strong post-crash, weak in trending markets. The
      2019-2025 window is dominated by the 2020 COVID crash and recovery. No evidence that the
      claimed mid-cap reversal edge is stable outside that one bull-market episode.

      **Action:**
      1. Post-process R12 backtest output via a new script `scripts/analyze_r12_regime_stability.py`
      2. Split the 2019-2025 run into two independent periods: 2019-2022 and 2023-2025
      3. Compute Sharpe/CAGR/Calmar for each sub-period independently
      4. Measure correlation: is the edge concentrated in 2020-2021 recovery, or is it consistent?
      5. Document results in the run's metadata (add a `regime_stability` JSON field to `backtest_runs`)

      **Success criteria:**
      - Sub-period Sharpe 2019-2022 and 2023-2025 both >0.70 (edge is consistent)
      - If 2019-2022 is much stronger (>1.0) and 2023-2025 is weak (<0.6), reversal is a bull-market artifact
      - Results attached to the run record (e.g., `regime_stability_2019_2022_sharpe`, `regime_stability_2023_2025_sharpe`)

      **Gate:** If sub-periods differ by >0.4 Sharpe, R12 is regime-dependent and should not ship. If consistent, proceed.

    notes: |
      - This is especially important because the backtest window straddles the Fyers data seam (2019 legacy, 2020+ Fyers)
      - A 2023-2025 post-COVID regime test is the real OOS validation — 2019-2022 is the fit window

  - id: B-019
    title: "Recompute DSR (Deflated Sharpe Ratio) with full program-wide trial count"
    area: "Backtest / R-Family"
    status: "⏳ pending"
    severity: "🔴 high"
    blocked_on: "B-015 (need run records to compute DSR)"
    depends_on: [B-015]
    time_estimate: "~1-2 hours"
    description: |
      **Selection bias severely understated.** The R-family program tested 12 phases across ~100+
      configurations (momentum sweeps, variant selector sweeps, skip-month combinations, etc.). The
      DSR was computed with `n_trials=2` (only the current 10-job queue) but should use the true
      program-wide count (~100+), which dramatically increases the null-hypothesis Sharpe under random noise.

      **Action:**
      1. Audit `backtest/reports/*.json` and `backtest_runs` table to count ACTUAL strategies tested across R1-R12 program
      2. Include all momentum grid runs, all skip-month variants, all band tests, all reversal tests
      3. Estimate true `n_trials` (likely 200-500 considering the 42 technical-template sweep + momentum variants)
      4. Re-run `deflated_sharpe_ratio(..., n_trials=true_count)` on R10/R12 results
      5. Recompute post-hoc DSR and attach to run records

      **Success criteria:**
      - True n_trials measured and documented (e.g., "R-family program: 287 unique configurations tested")
      - R12 DSR recalculated: if new DSR <0.5 (high probability of being noise), R12 should be archived
      - R10 DSR recalculated: expected to remain >0.8 (is more robust to multiple testing)
      - Results added to each run's metadata JSON

      **Impact:** This is the evidence that R12 might be pure noise — selection bias is critical.

    notes: |
      - Bailey & López de Prado's formula for E[max Sharpe | null hypothesis] grows with n_trials^0.5
      - Using n_trials=2 instead of 200+ is hiding a potentially 10x undercount of false-positive probability
      - This audit may reveal that many R-family strategies are below the DSR threshold

