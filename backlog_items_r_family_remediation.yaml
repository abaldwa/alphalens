  - id: B-021
    title: "Add snapshot-vs-live reconciliation check for backtest cache"
    area: "Data Layer / Backtest"
    status: "⏳ pending"
    severity: "🟡 medium"
    blocked_on: "None"
    depends_on: []
    time_estimate: "~2-3 hours"
    description: |
      **Production-safety gap found:** The backtest cache snapshot (e.g., `backtest/cache/ohlcv_snapshots/2019-01-01_2025-12-31.parquet`)
      is generated once (2026-08-22 for R12) but is never reconciled against the live `ohlcv_adjusted` table. Known 960+ OHLCV
      gaps exist in the codebase — if backfills happen post-snapshot, the snapshot silently goes stale.

      **Action:**
      1. Add new module `backtest/core/snapshot_reconcile.py`
      2. Implement `verify_snapshot_integrity(snapshot_path, ohlcv_table)` function:
         - Compare row counts (snapshot vs live)
         - Compare date ranges (should be exact match)
         - Compare hash/checksum of a sample of rows (detect silent corruption)
         - Raise loud warning if divergence > threshold (e.g., 1% row count difference)
      3. Wire into `run_orchestrator_backtest.py::main()` and `run_strategy_queue.py` before any job runs
      4. If snapshot fails verification, either warn and fall back to live reads or fail fast
      5. Log results to `execution_logs/` for audit

      **Success criteria:**
      - New validation runs before every queue execution
      - 2019-2025 snapshot verified as aligned with live ohlcv_adjusted (or flagged as diverged)
      - Future snapshots carry a `.manifest.json` with row count, date range, SHA256 checksum
      - Backtest can recover gracefully if snapshot is stale

      **Gate for paper trading:** Before live dispatch, this check must pass consistently.

    notes: |
      - This is the most straightforward infrastructure gap to close
      - Prevents silent data corruption from becoming silent strategy corruption

