## Priority & Sequencing

### Phase 1 (Validation, parallel, ~1 hour)
- **B-014 + B-015 (parallel):** Execute queues, verify results exist. If B-015 fails, decision point: archive R12 or debug (route to B-020).

### Phase 2 (Design audits, parallel, ~4 hours)
- **B-018 (sub-period breakdown):** Regime stability test
- **B-019 (DSR recompute):** Selection bias audit
- **B-020 (robustness failures):** Root-cause check_08/check_09
- **B-021 (snapshot reconciliation):** Infrastructure hardening
- **B-022 (trade_log schema):** Enable R11 reporting

### Phase 3 (Conditional, if R12 survives)
- **B-016 (liquidity bucketing):** Wire the claimed liquidity interaction
- **B-017 (monthly rebalance):** Signal-decay test

### Phase 4 (Gate decision)
- If B-015 + B-018 + B-019 + B-020 all show R12 is fundamentally sound → proceed with B-016/B-017
- If any fail → archive R12, focus on R10 composite integration
