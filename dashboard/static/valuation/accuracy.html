<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens.Valuation — Valuation Accuracy</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shell.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-bar" id="app-bar"></div>
<div class="sub-tabs" id="sub-tabs"></div>
<div class="page">
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Valuation Accuracy</span><span class="sec-sub" id="accuracy-notes">Backtest of past valuation_signals predictions against realized price outcomes</span></div>
    <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      <label style="font-size:12px;color:var(--tx2)">Horizon (days)
        <input type="number" id="horizon-input" value="5" min="1" max="252" style="width:70px;margin-left:6px">
      </label>
      <button id="run-btn">Run Backtest</button>
    </div>
    <div id="summary-cards"></div>
    <div id="accuracy-table"><div class="empty">Run the backtest to see results</div></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/empty_state.js"></script>
<script src="js/accuracy.js"></script>
</body>
</html>
