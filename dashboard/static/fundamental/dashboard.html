<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens.Fundamental — Financial Dashboard</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shell.css">
</head>
<body>
<div class="app-bar" id="app-bar"></div>
<div class="sub-tabs" id="sub-tabs"></div>
<div class="page">
  <div class="sec">
    <div class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
      <input type="text" id="ticker-input" placeholder="Ticker (e.g. RELIANCE)">
      <button id="load-btn">Load</button>
    </div>
    <div id="fa-header"></div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Quarterly Trend</span></div>
    <div id="fa-table"><div class="empty">Enter a ticker to load quarterly fundamentals</div></div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Peer-Relative Ranking (Traffic Light)</span></div>
    <div id="fa-traffic-light"></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/empty_state.js"></script>
<script src="../js/crosslink.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
