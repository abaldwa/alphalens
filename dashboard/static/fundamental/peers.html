<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens.Fundamental — Peer Comparison</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shell.css">
</head>
<body>
<div class="app-bar" id="app-bar"></div>
<div class="sub-tabs" id="sub-tabs"></div>
<div class="page">
  <div class="sec">
    <div class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
      <input type="text" id="ticker-input" list="ticker-list" placeholder="Ticker (e.g. RELIANCE)">
      <button id="load-btn">Load</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Peer Comparison</span><span class="sec-sub" id="peers-sector"></span></div>
    <div id="peers-table"><div class="empty">Enter a ticker to find its peers</div></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/ticker_picker.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/empty_state.js"></script>
<script src="js/peers.js"></script>
</body>
</html>
