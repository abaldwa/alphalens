<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens.Fundamental — Sector Deep-Dive</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shell.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-bar" id="app-bar"></div>
<div class="sub-tabs" id="sub-tabs"></div>
<div class="page">
  <div class="sec">
    <div class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
      <input type="text" id="sector-input" placeholder="Sector (e.g. Capital Goods)">
      <button id="load-btn">Load</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Sector Aggregate Ratios</span><span class="sec-sub" id="sector-count"></span></div>
    <div id="sector-avg-table"><div class="empty">Enter a sector to load</div></div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Sector-Unique Metrics</span></div>
    <div id="sector-unique"></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/empty_state.js"></script>
<script src="js/sector.js"></script>
</body>
</html>
