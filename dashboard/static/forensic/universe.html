<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens.Forensic — Universe Scan</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shell.css">
</head>
<body>
<div class="app-bar" id="app-bar"></div>
<div class="sub-tabs" id="sub-tabs"></div>
<div class="page">
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Universe Forensic Scan</span><span class="sec-sub" id="universe-date"></span></div>
    <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      <label style="font-size:12px;color:var(--tx2)">Tickers this run
        <input type="number" id="scan-limit-input" value="300" min="1" max="2500" style="width:80px;margin-left:6px">
      </label>
      <button id="run-scan-btn">Run Scan Now</button>
      <span id="scan-status" style="font-size:12px;color:var(--tx2)"></span>
    </div>
    <div id="universe-summary"><div class="loading">Loading…</div></div>
  </div>
  <div class="sec">
    <div id="universe-table"><div class="loading">Loading…</div></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/empty_state.js"></script>
<script src="js/universe.js"></script>
</body>
</html>
