<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens.ML — Daily WatchList</title>
<link rel="stylesheet" href="../css/tokens.css">

</head>
<body>
<div class="app-bar" id="app-bar"></div>
<div class="sub-tabs" id="sub-tabs"></div>
<div class="page">

    <div class="sec-head"><span class="sec-title">Daily WatchList</span><span class="sec-sub" id="watchlist-notes">Top buy signals per horizon, with realistic (quantile/ATR-derived) price targets — not a fixed %</span></div>

    <div id="watchlist-5d"><div class="loading">Loading…</div></div>

  <div class="sec">
    <div class="sec-head"><span class="sec-title">21-Day Horizon</span></div>
    <div id="watchlist-21d"><div class="loading">Loading…</div></div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">63-Day Horizon</span></div>
    <div id="watchlist-63d"><div class="loading">Loading…</div></div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">MultiBagger Candidates</span><span class="sec-sub" id="mb-notes"></span></div>
    <div id="watchlist-mb"><div class="loading">Loading…</div></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
