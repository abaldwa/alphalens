<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens.Technical — Compare</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shell.css">
</head>
<body>
<div class="app-bar" id="app-bar"></div>
<div class="sub-tabs" id="sub-tabs"></div>
<div class="page">
  <div class="sec">
    <div class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
      <input type="text" id="tickers-input" placeholder="Up to 5 tickers, comma-separated">
      <button id="load-btn">Compare</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">RS / Beta / Alpha</span></div>
    <div id="rs-table"><div class="empty">Enter tickers to compare</div></div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Correlation Matrix (60-day returns)</span></div>
    <div id="corr-matrix"></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/empty_state.js"></script>
<script src="js/compare.js"></script>
</body>
</html>
