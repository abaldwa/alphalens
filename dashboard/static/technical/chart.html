<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens.Technical — Chart</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shell.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-bar" id="app-bar"></div>
<div class="sub-tabs" id="sub-tabs"></div>
<div class="page">
  <div class="sec">
    <div class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
      <input type="text" id="ticker-input" list="ticker-list" placeholder="Ticker (e.g. RELIANCE)">
      <button id="load-btn">Load</button>
    </div>
  </div>
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Price</span><span class="sec-sub" id="ind-date"></span></div>
    <div id="price-card"><div class="empty">Enter a ticker to load</div></div>
  </div>
  <div class="sec">
    <div class="sec-head">
      <span class="sec-title" style="font-size:14px">Candlestick (T3)</span>
      <span class="sec-sub">
        <label style="font-weight:400"><input type="checkbox" id="ov-sma50" checked> SMA50</label>
        <label style="font-weight:400;margin-left:8px"><input type="checkbox" id="ov-sma200" checked> SMA200</label>
        <label style="font-weight:400;margin-left:8px"><input type="checkbox" id="ov-ema21" checked> EMA21</label>
      </span>
    </div>
    <div class="card" id="candle-card">
      <canvas id="candle-canvas" height="110"></canvas>
    </div>
    <div class="card" style="margin-top:8px">
      <canvas id="volume-canvas" height="40"></canvas>
    </div>
  </div>
  <div class="grid grid-2">
    <div class="sec">
      <div class="sec-head"><span class="sec-title" style="font-size:14px">Indicators</span></div>
      <div id="indicators-card"></div>
    </div>
    <div class="sec">
      <div class="sec-head"><span class="sec-title" style="font-size:14px">Pattern Scores</span></div>
      <div id="patterns-card"></div>
    </div>
  </div>
</div>
<script src="../vendor/chart.umd.min.js"></script>
<script src="../vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="../vendor/chartjs-chart-financial.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ticker_picker.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/empty_state.js"></script>
<script src="js/chart.js"></script>
</body>
</html>
