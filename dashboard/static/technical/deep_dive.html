<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaLens.Technical — Technical Deep Dive</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/shell.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="app-bar" id="app-bar"></div>
<div class="sub-tabs" id="sub-tabs"></div>
<div class="page">
  <div class="sec">
    <div class="sec-head"><span class="sec-title">Technical Deep Dive</span><span class="sec-sub">Look up a ticker, or open one from Daily WatchList's per-row icon</span></div>
    <div class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:16px">
      <input type="text" id="ticker-input" list="ticker-list" placeholder="Ticker">
      <input type="date" id="date-input">
      <button id="load-btn">Load</button>
    </div>
    <div id="deep-dive-header"></div>
  </div>
  <div class="sec">
    <div class="sec-title" style="font-size:14px;margin-bottom:12px">CMP, Range &amp; Delivery</div>
    <div id="row1-card"><div class="loading">Loading…</div></div>
  </div>
  <div class="sec">
    <div class="sec-title" style="font-size:14px;margin-bottom:12px">Moving Averages, Momentum &amp; Trend</div>
    <div id="row2-card"><div class="loading">Loading…</div></div>
  </div>
  <div class="sec">
    <div class="sec-title" style="font-size:14px;margin-bottom:12px">Ratios &amp; Distance</div>
    <div id="row3-card"><div class="loading">Loading…</div></div>
  </div>
  <div class="sec">
    <div class="sec-title" style="font-size:14px;margin-bottom:12px">Support / Resistance</div>
    <div id="levels-card"><div class="loading">Loading…</div></div>
  </div>
  <div class="sec">
    <div class="sec-title" style="font-size:14px;margin-bottom:12px">Chart Pattern Scores</div>
    <div id="patterns-card"><div class="loading">Loading…</div></div>
  </div>
</div>
<script src="../js/api.js"></script>
<script src="../js/ticker_picker.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/empty_state.js"></script>
<script src="../js/crosslink.js"></script>
<script src="../js/calendar_picker.js"></script>
<script src="js/deep_dive.js"></script>
</body>
</html>
