# mypy.ini
# Mypy configuration is defined in pyproject.toml under [tool.mypy].
# This file exists for discoverability: users running `mypy .` directly
# will pick up pyproject.toml automatically (mypy searches for it).
#
# Migration plan (per 4a in FeatureBacklog):
#   1. Currently: follow_imports = skip (covers the noisiest modules)
#   2. Per-week scope widening: move modules from "skip" to "normal" in
#      pyproject.toml's [[tool.mypy.overrides]] as they are cleaned up.
#   3. Target: all modules at strict with follow_imports = normal.
#
# Run: mypy .

[mypy]
# Configuration is in pyproject.toml; this section left empty for compatibility.
exclude = ^scripts/